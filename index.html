<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Sidebar</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="top-bar">
      <div class="window-controls" aria-hidden="true">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <span class="explore-title">Explore</span>
    </div>

    <nav class="menu" aria-label="Explore navigation">
      <a class="menu-item active" href="#" aria-current="page">
        <span class="icon">⌂</span>
        <span>Home</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">♫</span>
        <span>Music</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">♟</span>
        <span>Gaming</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">◈</span>
        <span>Education</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">⚛</span>
        <span>Science &amp; Tech</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">●</span>
        <span>Entertainment</span>
      </a>
      <a class="menu-item" href="#">
        <span class="icon">▣</span>
        <span>Student Hubs</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="bottom-controls">
        <a class="profile" href="#" aria-label="Profile">
          <span class="profile-mark">⌁</span>
          <span>Juan</span>
        </a>
        <button class="control-button" aria-label="Home">⌂</button>
        <button class="control-button" aria-label="Notifications">♧</button>
        <button class="control-button" aria-label="Games">♟</button>
      </div>
    </div>
  </aside>

  <script>
    document.querySelectorAll(".menu-item").forEach((item) => {
      item.addEventListener("click", (event) => {
        event.preventDefault();
        document.querySelectorAll(".menu-item").forEach((menuItem) => {
          menuItem.classList.remove("active");
          menuItem.removeAttribute("aria-current");
        });
        item.classList.add("active");
        item.setAttribute("aria-current", "page");
      });
    });
  </script>
</body>
</html>
